<noscript><p style="font-family:sans-serif;padding:40px">This site needs JavaScript to show its pages. Contact: <a href="mailto:saniyap@usc.edu">saniyap@usc.edu</a></p></noscript>
<script src="/assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let seen = false;
    try { seen = window.sessionStorage.getItem('sp_intro_seen') === '1'; } catch (e) {}
    this.state = { n: 0, skipped: seen, ready: false, shown: {}, sc: {}, brushD: 'M28 0', brushH: 2400, brushLen: 0 };
    this.onScroll = this.onScroll.bind(this);
    this.buildBrush = this.buildBrush.bind(this);
    this.ticking = false;
  }
  componentDidMount() {
    try { window.sessionStorage.setItem('sp_intro_seen', '1'); } catch (e) {}
    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.buildBrush);
    this.t1 = setTimeout(this.buildBrush, 200);
    this.t2 = setTimeout(this.buildBrush, 1500);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(this.buildBrush);
    this.onScroll();
    if (this.reduce || !('IntersectionObserver' in window)) return;
    this.io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          const k = e.target.getAttribute('data-reveal');
          this.setState((st) => ({ shown: Object.assign({}, st.shown, { [k]: true }) }));
          this.io.unobserve(e.target);
        }
      });
    }, { threshold: 0.18, rootMargin: '0px 0px -8% 0px' });
    // Only arm the reveals once the page can actually scroll (Play / a real browser),
    // otherwise the canvas — where the whole frame is visible — would use them all up.
    this.arm = () => {
      if (this.armed) return;
      const doc = document.documentElement;
      if ((doc.scrollHeight - (window.innerHeight || 0)) <= 900) return;
      const els = document.querySelectorAll('[data-reveal]');
      if (!els.length) return;
      this.armed = true;
      els.forEach((el) => this.io.observe(el));
      this.setState({ ready: true });
    };
    window.addEventListener('resize', this.arm);
    this.arm();
    this.retry = setTimeout(this.arm, 300);
    this.retry2 = setTimeout(this.arm, 1500);
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.buildBrush);
    if (this.io) this.io.disconnect();
    clearTimeout(this.retry); clearTimeout(this.retry2); clearTimeout(this.t1); clearTimeout(this.t2);
    if (this.arm) window.removeEventListener('resize', this.arm);
  }
  componentDidUpdate(prevProps, prevState) {
    if (prevState.brushD !== this.state.brushD) {
      const p = document.getElementById('brushpath');
      if (p && p.getTotalLength) {
        const len = Math.ceil(p.getTotalLength());
        if (len !== this.state.brushLen) this.setState({ brushLen: len }, this.onScroll);
      }
    }
  }
  buildBrush() {
    const sec = document.getElementById('work');
    if (!sec) return;
    const sr = sec.getBoundingClientRect();
    const H = Math.round(sec.offsetHeight);
    const titles = sec.querySelectorAll('[data-title]');
    const abs = (el) => { let x = 0, y = 0; for (let e = el; e; e = e.offsetParent) { x += e.offsetLeft; y += e.offsetTop; } return { x, y }; };
    const so = abs(sec);
    const m = 28;
    let d = 'M' + m + ' 0';
    let cy = 0;
    titles.forEach((t) => {
      const o = abs(t);
      const x0 = Math.round(o.x - so.x);
      const x1 = Math.round(x0 + Math.min(t.offsetWidth, 340));
      const yb = Math.round(o.y - so.y + t.offsetHeight + 10);
      d += ' C' + m + ' ' + Math.round(cy + (yb - cy) * 0.55) + ' ' + m + ' ' + (yb - 30) + ' ' + (x0 - 6) + ' ' + yb;
      d += ' C' + Math.round(x0 + (x1 - x0) * 0.3) + ' ' + (yb + 5) + ' ' + Math.round(x0 + (x1 - x0) * 0.7) + ' ' + (yb - 4) + ' ' + x1 + ' ' + (yb + 1);
      d += ' C' + (x1 - 30) + ' ' + (yb + 8) + ' ' + Math.round(x0 + 40) + ' ' + (yb + 9) + ' ' + m + ' ' + (yb + 40);
      cy = yb + 40;
    });
    d += ' C' + m + ' ' + Math.round(cy + (H - 140 - cy) * 0.6) + ' ' + m + ' ' + (H - 150) + ' ' + 300 + ' ' + (H - 170);
    d += ' C' + 460 + ' ' + (H - 182) + ' ' + 560 + ' ' + (H - 176) + ' ' + 640 + ' ' + (H - 166);
    if (d !== this.state.brushD || H !== this.state.brushH) this.setState({ brushD: d, brushH: H });
  }
  onScroll() {
    if (this.ticking) return;
    this.ticking = true;
    window.requestAnimationFrame(() => {
      this.ticking = false;
      const clamp = (v) => Math.min(1, Math.max(0, v));
      const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const y = window.scrollY || 0;
      const vh = window.innerHeight || 840;
      const scene = document.getElementById('scene');
      const dist = 600;
      const p = clamp(y / dist);
      const sec = document.getElementById('work');
      let brushProg = 0, workFill = 0;
      if (sec) {
        const r = sec.getBoundingClientRect();
        brushProg = clamp((vh * 0.72 - r.top) / (r.height - 120));
        workFill = clamp((vh * 0.5 - r.top) / r.height);
      }
      const nums = {};
      ['s1', 's2', 's3'].forEach((k) => {
        const el = document.querySelector('[data-reveal="' + k + '"]');
        if (!el) { nums[k] = 0; return; }
        const r = el.getBoundingClientRect();
        nums[k] = Math.max(0, Math.min(20, Math.round((r.top + r.height / 2 - vh / 2) * 0.06)));
      });
      const doc = document.documentElement;
      const canScroll = (doc.scrollHeight - vh) > 900;
      this.setState({ sc: { p: p, brushProg: brushProg, workFill: workFill, nums: nums, bar: canScroll && y > dist + 300, pinned: canScroll } });
    });
  }
  renderVals() {
    const { n, skipped, ready, shown, sc, brushD, brushH, brushLen } = this.state;
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const p = sc.p || 0;
    const open = ease(clamp(p / 0.5));
    const rot = this.reduce ? 0 : 1;
    const pinned = !!sc.pinned;
    const band = pinned ? ease(clamp((p - 0.7) / 0.3)) : 0;
    const cls = (k) => (!ready ? '' : (shown[k] ? 'reveal in' : 'reveal'));
    const nums = sc.nums || {};
    const len = brushLen || 0;
    return {
      introEven: !skipped && n % 2 === 0,
      introOdd: !skipped && n % 2 === 1,
      skipped: skipped,
      riseCls: skipped ? '' : 'rise',
      open: {
        left: 'rotateY(' + (open * 72 * rot).toFixed(2) + 'deg) translateX(' + (-open * 40).toFixed(1) + 'px)',
        right: 'rotateY(' + (-open * 72 * rot).toFixed(2) + 'deg) translateX(' + (open * 40).toFixed(1) + 'px)',
        fade: (1 - open).toFixed(3)
      },
      band: { y: ((1 - band) * 72).toFixed(1) + 'px', o: band.toFixed(3), rule: (band * 100).toFixed(1) + '%', write: ((1 - clamp((band - 0.3) / 0.7)) * 100).toFixed(1) + '%' },
      rv: { s1: cls('s1'), s2: cls('s2'), s3: cls('s3'), e: cls('e') },
      nums: { s1: (nums.s1 || 0) + 'px', s2: (nums.s2 || 0) + 'px', s3: (nums.s3 || 0) + 'px' },
      brush: { d: brushD, h: brushH, dash: len ? String(len) : '0 100000', off: (len * (1 - (sc.brushProg || 0))).toFixed(1) },
      sceneH: pinned ? '1440px' : '840px',
      showHdr: !pinned,
      barCls: sc.bar ? 'show' : '',
      workFill: ((sc.workFill || 0) * 100).toFixed(1) + '%',
      workDash: (140 * (1 - Math.max(0.15, sc.workFill || 0))).toFixed(1),
      skip: () => this.setState({ skipped: true }),
      replay: () => { window.scrollTo(0, 0); this.setState({ n: n + 1, skipped: false }); }
    };
  }
}
DC.mount(Component);
</script>
