        return o;
      })(),
      kin: { a: (this.reduce ? 0 : -(sc.heroY || 0) * 0.7).toFixed(1) + 'px', b: (this.reduce ? 0 : (sc.heroY || 0) * 0.5).toFixed(1) + 'px' },
      halo: { x: ((this.state.ty || 0) * 28).toFixed(1) + 'px', y: ((this.state.tx || 0) * 18).toFixed(1) + 'px', x2: ((this.state.ty || 0) * -22).toFixed(1) + 'px', y2: ((this.state.tx || 0) * -14).toFixed(1) + 'px' },
      tilt: { x: ((this.state.tx || 0) * -5).toFixed(2) + 'deg', y: ((this.state.ty || 0) * 6).toFixed(2) + 'deg', mx: (this.state.ty || 0).toFixed(3), my: (this.state.tx || 0).toFixed(3) },
      nums: { s1: (nums.s1 || 0) + 'px', s2: (nums.s2 || 0) + 'px', s3: (nums.s3 || 0) + 'px' },
      brush: { d: brushD, h: brushH, dash: len ? String(len) : '0 100000', off: (len * (1 - (sc.brushProg || 0))).toFixed(1) },
      sceneH: pinned ? '1440px' : '840px',
      showHdr: !pinned,
      barCls: sc.bar ? 'show' : '',
      workFill: ((sc.workFill || 0) * 100).toFixed(1) + '%',
      workDash: (140 * (1 - Math.max(0.15, sc.workFill || 0))).toFixed(1),
      skip: () => this.setState({ skipped: true }),
      replay: () => { window.scrollTo(0, 0); this.setState({ n: n + 1, skipped: false }); }
    };
  }
}
DC.mount(Component);
</script>
