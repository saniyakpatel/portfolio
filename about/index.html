<script src="/assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { live: false, ready: false, shown: {}, drift: {} };
    this.onScroll = this.onScroll.bind(this);
    this.check = this.check.bind(this);
    this.ticking = false;
  }
  componentDidMount() {
    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    window.addEventListener('resize', this.check);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.check();
    this.t1 = setTimeout(this.check, 250);
    this.t2 = setTimeout(this.check, 1200);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.check);
    window.removeEventListener('scroll', this.onScroll);
    if (this.io) this.io.disconnect();
    clearTimeout(this.t1); clearTimeout(this.t2);
  }
  // On the canvas the whole frame is visible at once, so nothing should animate there.
  // Animations arm only when the page is taller than the window, i.e. in Play / a real browser.
  check() {
    if (this.state.live) return;
    const doc = document.documentElement;
    const canScroll = (doc.scrollHeight - (window.innerHeight || 0)) > 240;
    if (!canScroll) return;
    this.setState({ live: true });
    this.onScroll();
    if (this.reduce || !('IntersectionObserver' in window)) return;
    this.io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          const k = e.target.getAttribute('data-reveal');
          this.setState((st) => ({ shown: Object.assign({}, st.shown, { [k]: true }) }));
          this.io.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });
    document.querySelectorAll('[data-reveal]').forEach((el) => this.io.observe(el));
    this.setState({ ready: true });
  }
  onScroll() {
    if (this.ticking || this.reduce) return;
    this.ticking = true;
    window.requestAnimationFrame(() => {
      this.ticking = false;
      const vh = window.innerHeight || 900;
      const el = document.querySelector('[data-reveal="story"]');
      let mark = 0;
      if (el) { const r = el.getBoundingClientRect(); mark = Math.max(-50, Math.min(50, Math.round((r.top + r.height / 2 - vh / 2) * -0.1))); }
      this.setState({ drift: { mark: mark } });
    });
  }
  renderVals() {
    const { live, ready, shown, drift } = this.state;
    const cls = (k) => (!ready ? '' : (shown[k] ? 'reveal in' : 'reveal'));
    return {
      heroCls: live ? 'go' : '',
      rv: { story: cls('story'), work: cls('work'), clock: cls('clock'), lens: cls('lens'), foot: cls('foot') },
      drift: { mark: ((drift && drift.mark) || 0) + 'px' }
    };
  }
}
DC.mount(Component);
</script>
