        d += ' C' + (x1 - 40) + ' ' + (yb + 5) + ' ' + R(x0 + 40) + ' ' + (yb + 5) + ' ' + (x0 - 6) + ' ' + (yb + 4);
        d += ' C' + (gx + 4) + ' ' + (yb + 10) + ' ' + gx + ' ' + (yb + 30) + ' ' + gx + ' ' + (yb + 70);
        d += ' C' + gx + ' ' + (aBot + 6) + ' ' + (gx - 10) + ' ' + (aBot + 30) + ' ' + (gx - 70) + ' ' + (aBot + 34);
        d += ' C' + R(gx - 70 - (gx - m) * 0.45) + ' ' + (aBot + 40) + ' ' + (m + 30) + ' ' + (aBot + 34) + ' ' + m + ' ' + (aBot + 70);
        cy = aBot + 70;
      } else {
        // text on the left: run down the margin, underline the title, slip back through the gap under it, continue down the margin
        d += ' C' + m + ' ' + R(cy + (yb - cy) * 0.55) + ' ' + m + ' ' + (yb - 30) + ' ' + (x0 - 6) + ' ' + yb;
        d += ' C' + R(x0 + (x1 - x0) * 0.3) + ' ' + (yb + 5) + ' ' + R(x0 + (x1 - x0) * 0.7) + ' ' + (yb - 4) + ' ' + x1 + ' ' + (yb + 1);
        d += ' C' + (x1 - 40) + ' ' + (yb + 5) + ' ' + R(x0 + 40) + ' ' + (yb + 5) + ' ' + (x0 - 6) + ' ' + (yb + 4);
        d += ' C' + (x0 - 18) + ' ' + (yb + 6) + ' ' + m + ' ' + (yb + 8) + ' ' + m + ' ' + (yb + 40);
        cy = yb + 40;
      }
    });
    d += ' C' + m + ' ' + R(cy + (H - 140 - cy) * 0.6) + ' ' + m + ' ' + (H - 150) + ' ' + 300 + ' ' + (H - 170);
    d += ' C' + 460 + ' ' + (H - 182) + ' ' + 560 + ' ' + (H - 176) + ' ' + Math.min(640, W - 40) + ' ' + (H - 166);
    this.secTop = so.y;
    if (d !== this.state.brushD || H !== this.state.brushH) this.setState({ brushD: d, brushH: H });
  }
  // length along the path whose point first reaches layout depth y (table built once per path)
  lenAtY(y) {
    const t = this.tbl;
    if (!t || !t.length) return 0;
    if (y <= t[0].y) return 0;
    for (let i = 1; i < t.length; i++) if (t[i].maxY >= y) return t[i].l;
    return t[t.length - 1].l;
  }
  onScroll() {

      const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const y = window.scrollY || 0;
      const vh = window.innerHeight || 840;
      const scene = document.getElementById('scene');
      const dist = 600;
      const p = clamp(y / dist);
      const sec = document.getElementById('work');
      let brushProg = 0, workFill = 0;
      if (sec) {
        const r = sec.getBoundingClientRect();
        workFill = clamp((vh * 0.5 - r.top) / r.height);
        // scroll position as a fraction, converted to layout depth: works the same at any zoom, in any browser, and in Play
        const doc = document.documentElement;
        const maxS = Math.max(1, doc.scrollHeight - doc.clientHeight);
        const f = clamp(y / maxS);
        const Hd = document.body.offsetHeight || sec.offsetHeight;
        const vhL = Hd * (doc.clientHeight / Math.max(1, doc.scrollHeight));
        let depth = f * (Hd - vhL) + vhL * 0.62 - (this.secTop || 0);
        // the page can end before the line does: ease the remaining tail in over the last stretch of scrolling
        const t = this.tbl, endY = t && t.length ? t[t.length - 1].maxY + 2 : 0;
        const depthMax = (Hd - vhL) + vhL * 0.62 - (this.secTop || 0);
        const k = clamp((f - 0.55) / 0.45);
        if (endY > depthMax) depth += (endY - depthMax) * k * k;
        const total = this.state.brushLen || 0;
        if (total) brushProg = clamp(this.lenAtY(depth) / total);
      }
      const nums = {};
      ['s1', 's2', 's3'].forEach((k) => {
        const el = document.querySelector('[data-reveal="' + k + '"]');
        if (!el) { nums[k] = 0; return; }
        const r = el.getBoundingClientRect();
        nums[k] = Math.max(0, Math.min(20, Math.round((r.top + r.height / 2 - vh / 2) * 0.06)));
      });
      const doc = document.documentElement;
      const canScroll = (doc.scrollHeight - vh) > 900;
      // hero drift + who-I-am ink, both from scroll fraction in layout units
      const docE = document.documentElement;
      const fr = clamp(y / Math.max(1, docE.scrollHeight - docE.clientHeight));
      const HdL = document.body.offsetHeight || 1;
      const vhLL = HdL * (docE.clientHeight / Math.max(1, docE.scrollHeight));
      const yL = fr * (HdL - vhLL);
      const ab = document.getElementById('about-me');
      let abP = -1;
      if (ab) { let top = 0; for (let e = ab; e; e = e.offsetParent) top += e.offsetTop; abP = (yL + 72 - top) / Math.max(1, ab.offsetHeight - 720); }
      this.setState({ sc: { p: p, brushProg: brushProg, workFill: workFill, nums: nums, bar: canScroll && y > dist + 300, pinned: canScroll, heroY: yL, abP: abP } });
    });
  }
  renderVals() {
    const { n, skipped, ready, shown, sc, brushD, brushH, brushLen } = this.state;
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const p = sc.p || 0;
    const open = ease(clamp(p / 0.5));
    const rot = this.reduce ? 0 : 1;
    const pinned = !!sc.pinned;
    const band = pinned ? ease(clamp((p - 0.7) / 0.3)) : 0;
    const cls = (k) => (!ready ? '' : (shown[k] ? 'reveal in' : 'reveal'));
    const nums = sc.nums || {};
    const len = brushLen || 0;
    return {
      introEven: !skipped && n % 2 === 0,
      introOdd: !skipped && n % 2 === 1,
      skipped: skipped,
      riseCls: skipped ? '' : 'rise',
      open: {
        left: 'rotateY(' + (open * 72 * rot).toFixed(2) + 'deg) translateX(' + (-open * 40).toFixed(1) + 'px)',
        right: 'rotateY(' + (-open * 72 * rot).toFixed(2) + 'deg) translateX(' + (open * 40).toFixed(1) + 'px)',
        fade: (1 - open).toFixed(3)
      },
      band: { y: ((1 - band) * 72).toFixed(1) + 'px', o: band.toFixed(3), rule: (band * 100).toFixed(1) + '%', write: ((1 - clamp((band - 0.3) / 0.7)) * 100).toFixed(1) + '%' },
      rv: { s1: cls('s1'), s2: cls('s2'), s3: cls('s3'), e: cls('e'), ab: cls('ab'), ft: cls('ft') },
      goCls: 'go' + (this.state.io === 'run' ? ' irun' : (this.state.io === 'done' ? ' iplayed' : '')),
      introOn: this.state.io === 'run',
      intro: { m: this.state.im === 'board' ? 'board' : '' },
      ib: this.state.ib || { x: '0px', y: '0px', s: '.3' },
      skipIntro: this.skipIntro || (() => {}),
      hero: { shift: (this.reduce ? 0 : Math.min(160, (sc.heroY || 0) * 0.22)).toFixed(1) + 'px', cue: (sc.heroY || 0) > 40 ? '0' : '1' },
      bw: { v: (this.reduce ? 1 : clamp(((sc.abP == null ? -1 : sc.abP) + 0.64) / 0.3)).toFixed(3) },
      about: { p: (this.reduce ? 1 : clamp(((sc.abP == null ? -1 : sc.abP) + 0.24) / 0.48)).toFixed(3) },
      fx: (() => {
        // basics change on a calm timer once you reach them, so scrolling fast can never flick them past
        const sp = sc.abP == null ? -1 : sc.abP;
        const i = this.state.fi || 0;
        const o = { show: this.reduce || sp > 0.22 ? '1' : '0', num: '0' + (i + 1) };
        for (let k = 0; k < 5; k++) { o['o' + k] = k === i ? '1' : '0'; o['y' + k] = (k === i ? 0 : (k < i ? -46 : 46)) + 'px'; o['c' + k] = k <= i ? '#283f73' : '#c8d3ea'; }
        return o;
      })(),
      kin: { a: (this.reduce ? 0 : -(sc.heroY || 0) * 0.7).toFixed(1) + 'px', b: (this.reduce ? 0 : (sc.heroY || 0) * 0.5).toFixed(1) + 'px' },
      halo: { x: ((this.state.ty || 0) * 28).toFixed(1) + 'px', y: ((this.state.tx || 0) * 18).toFixed(1) + 'px', x2: ((this.state.ty || 0) * -22).toFixed(1) + 'px', y2: ((this.state.tx || 0) * -14).toFixed(1) + 'px' },
      tilt: { x: ((this.state.tx || 0) * -5).toFixed(2) + 'deg', y: ((this.state.ty || 0) * 6).toFixed(2) + 'deg', mx: (this.state.ty || 0).toFixed(3), my: (this.state.tx || 0).toFixed(3) },
      nums: { s1: (nums.s1 || 0) + 'px', s2: (nums.s2 || 0) + 'px', s3: (nums.s3 || 0) + 'px' },
      brush: { d: brushD, h: brushH, dash: len ? String(len) : '0 100000', off: (len * (1 - (sc.brushProg || 0))).toFixed(1) },
      sceneH: pinned ? '1440px' : '840px',
      showHdr: !pinned,
      barCls: sc.bar ? 'show' : '',
      workFill: ((sc.workFill || 0) * 100).toFixed(1) + '%',
      workDash: (140 * (1 - Math.max(0.15, sc.workFill || 0))).toFixed(1),
      skip: () => this.setState({ skipped: true }),
      replay: () => { window.scrollTo(0, 0); this.setState({ n: n + 1, skipped: false }); }
    };
  }
}
DC.mount(Component);
