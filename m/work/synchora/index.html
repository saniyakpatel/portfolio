<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { live: false, ready: false, shown: {}, slide: 0, sn: 0, menu: false };
    this.check = this.check.bind(this);
  }
  componentDidMount() {
    this.reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    window.addEventListener('resize', this.check);
    document.querySelectorAll('video.herovid').forEach((v) => { v.muted = true; if (this.reduce) { v.pause(); v.controls = true; } else { const pr = v.play(); if (pr && pr.catch) pr.catch(() => { v.controls = true; }); } });
    this.check(); this.t1 = setTimeout(this.check, 250); this.t2 = setTimeout(this.check, 1200);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.check);
    
    if (this.io) this.io.disconnect();
    clearTimeout(this.t1); clearTimeout(this.t2);
  }
  // Animations arm only when the page can scroll (Play / a real browser), so the canvas stays still.
  check() {
    if (this.state.live) return;
    const doc = document.documentElement;
    if ((doc.scrollHeight - (window.innerHeight || 0)) <= 240) return;
    this.setState({ live: true });
    
    if (this.reduce || !('IntersectionObserver' in window)) return;
    this.io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          const k = e.target.getAttribute('data-reveal');
          this.setState((st) => ({ shown: Object.assign({}, st.shown, { [k]: true }) }));
          this.io.unobserve(e.target);
        }
      });
    }, { threshold: 0.02 });
    document.querySelectorAll('[data-reveal]').forEach((el) => this.io.observe(el));
    this.setState({ ready: true });
  }
  renderVals() {
    const { live, ready, shown } = this.state;
    const cls = (k) => (!ready ? '' : (shown[k] ? 'reveal in' : 'reveal'));
    const rv = {};
    for (let i = 1; i <= 8; i++) rv['s' + i] = cls('s' + i);
    const out = { goCls: live ? 'go' : '', rv: rv, menu: this.state.menu, openMenu: () => this.setState({ menu: true }), closeMenu: () => this.setState({ menu: false }) };
    return out;
  }
}
DC.mount(Component);
</script>
