.brush{display:inline-block;padding:.12em .22em;margin:-.12em -.22em;-webkit-mask-image:linear-gradient(90deg,#000 0 42%,transparent 58% 100%);mask-image:linear-gradient(90deg,#000 0 42%,transparent 58% 100%);-webkit-mask-size:260% 100%;mask-size:260% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:0 0;mask-position:0 0}

.capname{white-space:normal;text-wrap:pretty}

.toc:hover{background:var(--tint);color:var(--tintInk)}

.toc:hover span{color:inherit !important}
.toc .cnt{color:#4a4a4f}

<script src="/assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { live: false, tab: 'sprints' };
    this.check = this.check.bind(this);
  }
  componentDidMount() {
    window.addEventListener('resize', this.check);
    this.check(); this.t1 = setTimeout(this.check, 250); this.t2 = setTimeout(this.check, 1200);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.check); clearTimeout(this.t1); clearTimeout(this.t2); }
  // Page-load animations arm only when the page can scroll (Play / a real browser).
  // Tab switching works everywhere, including on the canvas.
  check() {
    if (this.state.live) return;
    const doc = document.documentElement;
    if ((doc.scrollHeight - (window.innerHeight || 0)) > 240) this.setState({ live: true });
  }
  pick(k) {
    if (k === this.state.tab) return;
    this.setState({ tab: k });
    const bar = document.getElementById('tabs');
    if (bar && this.state.live) {
      const top = bar.getBoundingClientRect().top + window.scrollY;
      if (window.scrollY > top) window.scrollTo({ top: top, behavior: 'smooth' });
    }
  }
  renderVals() {
    const keys = ["sprints", "pitches", "art"];
    const on = {"sprints": ["#c8d3ea", "#111111"], "pitches": ["#283f73", "#f8f8f9"], "art": ["#e3dacb", "#111111"]};
    const t = this.state.tab, i = keys.indexOf(t);
    const show = {}, pon = {}, pressed = {}, go = {};
    keys.forEach((k) => {
      show[k] = k === t;
      pon[k] = k === t ? 'on' : '';
      pressed[k] = k === t ? 'true' : 'false';
      go[k] = () => this.pick(k);
    });
    return {
      goCls: this.state.live ? 'go' : '',
      show: show, pon: pon, pressed: pressed, go: go,
      hl: { x: (i * 260) + 'px', bg: on[t][0] }
    };
  }
}
DC.mount(Component);
</script>
